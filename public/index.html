<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>黄浪发 · Langfa Huang</title>
    <meta
      name="description"
      content="前端开发工程师 · Web experience, visualization and engineering."
    />
    <script>
      (function () {
        try {
          // Strip "/index.html" and any trailing slash so this works both at
          // the site root and under a sub-path (e.g. GitHub Pages basePath).
          var base = location.pathname
            .replace(/\/index\.html$/, "")
            .replace(/\/+$/, "");
          var langs =
            navigator.languages && navigator.languages.length
              ? navigator.languages
              : [navigator.language || "zh"];
          var isZh = langs.some(function (l) {
            return String(l).toLowerCase().indexOf("zh") === 0;
          });
          location.replace(base + (isZh ? "/zh/" : "/en/"));
        } catch (e) {
          location.replace("zh/");
        }
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=zh/" /></noscript>
  </head>
  <body>
    <p>Redirecting… <a href="zh/">中文</a> · <a href="en/">English</a></p>
  </body>
</html>
